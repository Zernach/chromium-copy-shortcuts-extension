<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7AB1FF"/>
      <stop offset="100%" stop-color="#4A86E8"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- Back clipboard (offset to suggest "copy") -->
  <rect x="22" y="32" width="62" height="74" rx="7" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Front clipboard -->
  <rect x="38" y="22" width="68" height="84" rx="8" fill="#FFFFFF"/>

  <!-- Clipboard clip -->
  <rect x="58" y="14" width="28" height="18" rx="4" fill="#2F5BB7"/>
  <rect x="64" y="20" width="16" height="6" rx="2" fill="#FFFFFF"/>

  <!-- Lines representing snippets -->
  <rect x="50" y="48" width="44" height="6" rx="3" fill="#5B9DFF"/>
  <rect x="50" y="62" width="32" height="6" rx="3" fill="#5B9DFF"/>
  <rect x="50" y="76" width="38" height="6" rx="3" fill="#5B9DFF"/>
  <rect x="50" y="90" width="24" height="6" rx="3" fill="#5B9DFF"/>
</svg>
