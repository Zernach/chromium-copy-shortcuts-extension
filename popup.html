<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>⚡️ Quick Copies</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="app-header">
    <h1 style="color: #c1c1c1;">⚡️ Quick Copies</h1>
    <div class="header-actions">
      <button id="add-btn" type="button" class="lock-btn" aria-label="New shortcut" title="New shortcut">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <div id="position-wrap" class="position-wrap" hidden>
        <button id="position-btn" type="button" class="lock-btn position-btn" aria-haspopup="true" aria-expanded="false"
          aria-label="Change panel position" title="Change panel position">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="12" y1="3" x2="12" y2="21" />
          </svg>
        </button>
        <div id="position-menu" class="position-menu" role="menu" hidden>
          <button type="button" class="position-option" data-position="upper-left" role="menuitemradio"
            aria-checked="false" title="Upper left">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <rect x="5" y="5" width="7" height="7" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button type="button" class="position-option" data-position="upper-right" role="menuitemradio"
            aria-checked="false" title="Upper right">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <rect x="12" y="5" width="7" height="7" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button type="button" class="position-option" data-position="lower-left" role="menuitemradio"
            aria-checked="false" title="Lower left">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <rect x="5" y="12" width="7" height="7" fill="currentColor" stroke="none" />
            </svg>
          </button>
          <button type="button" class="position-option" data-position="lower-right" role="menuitemradio"
            aria-checked="false" title="Lower right">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <rect x="12" y="12" width="7" height="7" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>
      </div>
      <button id="lock-btn" type="button" class="lock-btn" aria-pressed="false" aria-label="Lock panel open"
        title="Lock panel open">
        <svg class="lock-icon lock-icon-open" viewBox="0 0 24 24" width="16" height="16" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 9.9-1" />
        </svg>
        <svg class="lock-icon lock-icon-closed" viewBox="0 0 24 24" width="16" height="16" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <ul id="shortcuts-list" class="shortcuts-list" aria-label="Saved shortcuts"></ul>

    <p id="empty-state" class="empty-state" hidden>
      No shortcuts yet.
    </p>
  </main>

  <footer id="app-footer" class="app-footer" hidden>
    <form id="add-form" class="add-form" hidden>
      <label for="shortcut-text" id="form-label" class="form-label">New shortcut</label>
      <textarea id="shortcut-text" class="form-textarea" placeholder="Type or paste the text you want to save…" rows="4"
        required></textarea>
      <div class="form-actions">
        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </form>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="popup.js"></script>
</body>

</html>
