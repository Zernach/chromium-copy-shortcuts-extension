<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark">
  <title>Copy Shortcuts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <h1>Copy Shortcuts</h1>
    <button id="lock-btn" type="button" class="lock-btn" aria-pressed="false" aria-label="Lock panel open" title="Lock panel open">
      <svg class="lock-icon lock-icon-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
      <svg class="lock-icon lock-icon-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>
  </header>

  <main class="app-main">
    <ul id="shortcuts-list" class="shortcuts-list" aria-label="Saved shortcuts"></ul>

    <p id="empty-state" class="empty-state" hidden>
      No shortcuts yet. Click below to add one.
    </p>

    <form id="add-form" class="add-form" hidden>
      <label for="shortcut-text" class="form-label">New shortcut text</label>
      <textarea
        id="shortcut-text"
        class="form-textarea"
        placeholder="Type or paste the text you want to save…"
        rows="4"
        required
      ></textarea>
      <div class="form-actions">
        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="save-btn" class="btn btn-primary">Save</button>
      </div>
    </form>

    <button id="new-btn" type="button" class="btn btn-primary btn-block">
      <span class="btn-icon" aria-hidden="true">+</span>
      <span>New Shortcut</span>
    </button>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
